# post-commit — mandatory merge gate.
#
# No AI attribution anywhere in the history, conventional commit subjects,
# no credentials added. Every rule — and what happens to a pull request that
# fails them — lives in kodflow/post-commit. The gate is pinned to @main on
# purpose: it holds contents: read only, and a fix there is live here on the
# next run with no change to this file. Do not pin it, and do not copy the
# logic into this repo.
#
# The job MUST stay named `post-commit`: that is the status the branch
# ruleset requires, so renaming it or deleting this file leaves the required
# status unreported and blocks every merge. It is also why this is not a
# reusable workflow: a called job reports as `<caller> / <job>`, never as
# `post-commit`, and from any owner but kodflow it could not reach that
# owner's self-hosted runners at all.
#
# `runs-on:` is the only thing allowed to differ between repositories. A private
# repository runs both jobs on its owner's self-hosted runner, set centrally in
# RUNNER_OVERRIDES of kodflow/post-commit/scripts/enforce.sh; a public one stays
# on ubuntu-latest, because a self-hosted runner there would run strangers'
# pull requests on the fleet.
name: post-commit

on:
  pull_request:
    # ready_for_review matters: a failed run puts the pull request back into
    # draft, so marking it ready is how you ask for another verdict.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]
  # The verdict can change without this repository changing — a new rule, or a
  # rewritten history — so a quiet repository can be asked on demand.
  workflow_dispatch:

# One verdict at a time, one group per pull request (github.ref is
# refs/pull/<n>/merge there; head_ref would collide across forks). Without it
# a stale failure could draft a pull request a newer commit already fixed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  post-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job outputs survive a failed job, which is the only case that needs them.
    outputs:
      report: ${{ steps.gate.outputs.report }}
    steps:
      - uses: kodflow/post-commit@main
        id: gate
        with:
          # One human commits across the whole fleet, as this account.
          authors: kodflow

  # A fallback, not a gate: a failed run puts the pull request back into draft
  # and comments the verdict. Where a ruleset requires the status this is
  # redundant; where GitHub refuses one (a private repo in a Free-plan org) it
  # raises the cost of merging a failing history, it does not prevent it.
  #
  # A separate job so the gate above never holds a write token. The `if:` must
  # stay here: a job that does not start is what keeps `pull-requests: write`
  # away from push, manual and fork runs (a fork gets a read-only token anyway,
  # so it is skipped rather than failing on a grant that cannot happen).
  #
  # And pinned to a commit, unlike the gate: this is the one job holding a
  # write token, and @main would hand it to whatever @main becomes. The pin
  # moves only through kodflow/post-commit's scripts/bump-block-merge.sh and a
  # reviewed change to the central stub, which enforce.sh then rolls out.
  block-merge:
    needs: post-commit
    if: >-
      ${{ failure()
          && github.event_name == 'pull_request'
          && github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: kodflow/post-commit/block-merge@db14679a9662f4224ba8d99d189f100733f1da9e  # 2026-09-30
        with:
          report: ${{ needs['post-commit'].outputs.report }}
